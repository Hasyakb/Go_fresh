services:
  - type: web
    name: gofresh-record-book
    runtime: python
    repo: https://github.com/Hasyakb/Go_fresh
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gofresh-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      gunicorn app:app
    healthCheckPath: /login

databases:
  - name: gofresh-db
    plan: free
    databaseName: gofresh
    user: gofresh