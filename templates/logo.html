<svg viewBox="0 0 64 64" width="42" height="42" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GO-FRESH milkshake logo">
    <defs>
        <linearGradient id="gfBadge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0000a3"/>
            <stop offset="0.55" stop-color="#0000d6"/>
            <stop offset="1" stop-color="#0000ff"/>
        </linearGradient>
        <linearGradient id="gfShake" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fd6e7f"/>
            <stop offset="1" stop-color="#fa4659"/>
        </linearGradient>
    </defs>

    <!-- badge -->
    <circle cx="32" cy="32" r="30" fill="url(#gfBadge)"/>
    <circle cx="32" cy="32" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

    <!-- straw -->
    <path d="M39.5 8 L36 24" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M39.5 8 L36 24" stroke="#e02d44" stroke-width="2" stroke-linecap="round"/>

    <!-- cherry -->
    <circle cx="41.5" cy="10.5" r="3.2" fill="#fa4659" stroke="#ffffff" stroke-width="1.4"/>

    <!-- cup -->
    <path d="M21 26 h22 l-2.6 24.5 a4.5 4.5 0 0 1 -4.5 4 h-7.8 a4.5 4.5 0 0 1 -4.5 -4 Z"
          fill="#ffffff" opacity="0.96"/>

    <!-- shake -->
    <path d="M23.6 33 h16.8 l-1.9 17.6 a2.6 2.6 0 0 1 -2.6 2.3 h-7.8 a2.6 2.6 0 0 1 -2.6 -2.3 Z"
          fill="url(#gfShake)"/>

    <!-- foam line -->
    <rect x="23.2" y="29" width="17.6" height="4.6" rx="2.3" fill="#ffffff"/>

    <!-- highlight -->
    <path d="M27.5 37 l-1.2 12" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"
          stroke-linecap="round" fill="none"/>
</svg>
